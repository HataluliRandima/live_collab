name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported combination
          - elixir: "1.15.8"
            otp: "26.2"
          - elixir: "1.17.3"
            otp: "27.2"
          # Newest tested combination; also runs the lint and audit steps
          - elixir: "1.20.1"
            otp: "29.0"
            lint: true
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get

      - name: Check formatting
        if: matrix.lint
        run: mix format --check-formatted

      - name: Check for unused dependencies
        if: matrix.lint
        run: mix deps.unlock --check-unused

      - name: Audit dependencies (retired packages and security advisories)
        if: matrix.lint
        run: mix hex.audit

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Credo
        if: matrix.lint
        run: mix credo --strict

      - name: Tests
        run: mix test --warnings-as-errors

      - name: Multi-node tests
        run: |
          epmd -daemon
          mix test --only distributed

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.1"
          otp-version: "29.0"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/plts
          key: dialyzer-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: dialyzer-${{ runner.os }}-
      - run: mix deps.get
      - run: mix dialyzer --format github

  javascript:
    name: JavaScript hooks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
