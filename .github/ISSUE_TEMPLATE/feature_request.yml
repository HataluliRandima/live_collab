name: Feature request
description: Suggest an improvement or new collaboration primitive
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to build, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: API sketch, events, or components you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
